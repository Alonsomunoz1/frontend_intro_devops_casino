# ============================================================
# nginx.conf  -  casino-frontend (nginx-unprivileged, puerto 8080)
# Sirve el SPA de Angular y hace de reverse-proxy de /api/* hacia los
# backends internos del cl??ster (ClusterIP) usando el DNS interno de k8s.
#   - /api/bonos/*         -> bonos-service:8004
#   - /api/apuestas/*      -> apuestas-service:8005
#   - /api/estadisticas/*  -> estadisticas-service:8006
#   - el resto de /api/*   -> casino-backend:3000
# Los backends NUNCA son accesibles desde Internet (solo este nginx los alcanza).
# ============================================================
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html/browser;
    index index.html;

    # Resolver DNS interno del cl??ster (necesario para nombres de Service).
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;

    # --- Microservicios Python (enrutados por prefijo) ---
    location /api/bonos/ {
        proxy_pass http://bonos-service.default.svc.cluster.local:8004;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/apuestas/ {
        proxy_pass http://apuestas-service.default.svc.cluster.local:8005;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/estadisticas/ {
        proxy_pass http://estadisticas-service.default.svc.cluster.local:8006;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # --- Resto de la API (auth, usuarios, juegos, transacciones) -> backend Node ---
    location /api/ {
        proxy_pass http://casino-backend.default.svc.cluster.local:3000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # --- SPA Angular: cualquier ruta desconocida cae en index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
